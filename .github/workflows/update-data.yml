name: Update Achievement Data Cache

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Data from Google Sheet
        run: |
          curl -L "https://google.com" -o data.json

      - name: Commit and Push if Data Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 구글 스프레드시트 최신 업적 데이터 자동 캐싱 동기화" && git push)
